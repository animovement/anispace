url: https://animovement.dev/anispace/
home:
  title: "anispace – An R package providing spatial transformation methods for movement data"

# Shared navbar (incl. the animovement dropdown + Zulip), theme, and author
# details are inherited from animovementtemplate.
template:
  bootstrap: 5
  package: animovementtemplate

reference:
  - title: "Transformations"
    desc: |
      These functions allow you to make tranformations to your coordinate system,
      such as translations, rotations or conversion to polar coordinates.
    contents:
    - transform_to_egocentric
    - translate_coords
    - rotate_coords
    - map_to_cartesian
    - map_to_polar
    - map_to_cylindrical
    - map_to_spherical
    - cartesian_to_rho
    - cartesian_to_phi
    - cartesian_to_theta
    - polar_to_x
    - polar_to_y
    - spherical_to_z

  - title: "Helpers"
    desc:
    contents:
    - calculate_angular_difference
    - diff_angle
